<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wrikka Devtools</title>
    <style>
      * { box-sizing: border-box; }
      body {
        width: 320px; margin: 0; padding: 14px;
        background: #141419; color: #e8e8ec;
        font: 12.5px/1.5 ui-sans-serif, system-ui, sans-serif;
      }
      h1 { font-size: 14px; margin: 0 0 2px; display: flex; align-items: center; gap: 7px; }
      .sub { color: #9a9aa5; margin: 0 0 12px; font-size: 11.5px; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #666; flex: none; }
      .dot.ok { background: #3ddc84; } .dot.warn { background: #f5b83d; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
      td { padding: 4px 0; color: #b9b9c4; }
      td:last-child { text-align: right; color: #eee; font-weight: 600; }
      .url { word-break: break-all; color: #7f9cf5 !important; font-weight: 400 !important; margin-bottom: 8px; }
      .btn {
        display: block; width: 100%; padding: 7px 10px; margin-top: 6px;
        border-radius: 7px; border: 1px solid #3a3a44; background: #26262e;
        color: #eee; font-size: 12px; cursor: pointer; text-align: center;
      }
      .btn:hover { background: #30303a; }
      .btn.primary { background: #2f6fed; border-color: #2f6fed; }
      .btn:disabled { opacity: .45; cursor: default; }
      #status { min-height: 16px; color: #9a9aa5; margin-top: 8px; font-size: 11.5px; }
    </style>
  </head>
  <body>
    <h1><span id="dot" class="dot"></span>Wrikka Devtools Companion</h1>
    <p class="sub">wrikka-vite-devtools detector</p>
    <div id="url" class="url"></div>
    <table>
      <tr><td>Local dev server</td><td id="local">—</td></tr>
      <tr><td>Plugin detected</td><td id="plugin">—</td></tr>
    </table>
    <button id="hub" class="btn primary" disabled>Open hub</button>
    <button id="copy" class="btn">Copy setup snippet</button>
    <button id="recheck" class="btn">Re-check</button>
    <div id="status"></div>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
